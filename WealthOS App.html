const formatINR = (amount) => {
  if (amount === undefined || amount === null || isNaN(amount)) return '₹0';
  const absVal = Math.abs(amount);
  const sign = amount < 0 ? '-' : '';
  if (absVal >= 10000000) {
    return `${sign}₹${(absVal / 10000000).toFixed(2)} Cr`;
  }
  if (absVal >= 100000) {
    return `${sign}₹${(absVal / 100000).toFixed(2)} L`;
  }
  return `${sign}₹${Math.round(absVal).toLocaleString('en-IN')}`;
};

const formatExactINR = (amount) => {
  if (amount === undefined || amount === null || isNaN(amount)) return '₹0';
  const sign = amount < 0 ? '-' : '';
  return `${sign}₹${Math.round(Math.abs(amount)).toLocaleString('en-IN')}`;
};

        const weight = totalCurrent > 0 ? (curr / totalCurrent) * 100 : 0;

          ...h,

      // Weighted Portfolio CAGR, Benchmark Return, Alpha, and Beta
      const weightedCagr =
        totalCurrent > 0

      const weightedBenchmarkReturn =
        totalCurrent > 0

              (acc, h) => acc + h.benchmarkReturn * (h.current / totalCurrent),

      const portfolioAlpha = weightedCagr - weightedBenchmarkReturn;
      const weightedBeta =
        totalCurrent > 0

      // Class-level breakdown

        const avgCagr =
          clsCurrent > 0

          clsCurrent > 0

          assetClass: cls,
          count: clsItems.length,
          invested: clsInvested,
          current: clsCurrent,
          weight: clsWeight,
          avgCagr,
          avgBenchmark,
          alpha: avgCagr - avgBenchmark

      // Top 5 Outperformers & Bottom 5 Underperformers by Alpha

      const top5Performers = sortedByAlpha.slice(0, 5);
      const bottom5Performers = [...enrichedHoldings]
        .sort((a, b) => a.alpha - b.alpha)

      // Quantitative Volatility, Parametric 95% 1M VaR, CVaR, Sharpe & Debt Duration
      const rawWeightedVol =
        totalCurrent > 0
          ? enrichedHoldings.reduce((acc, h) => {
              const baseVol = BENCHMARK_MAP[h.assetClass]?.annualVol || 12;
              return acc + baseVol * (h.current / totalCurrent);

      // Diversification benefit factor (~0.86 across multi-asset holdings)

      const monthlyVol = effectiveAnnualVol / Math.sqrt(12) / 100;
      const monthlyMean = weightedCagr / 12 / 100;

      const cvar95Pct = var95Pct * 1.25;
      const cvar95Rupees = (cvar95Pct / 100) * totalCurrent;

      const riskFreeRate = 6.75; // India 10Y G-Sec proxy

  // Step 5: Look-Through Stock Overlap, Sector Overlap & Weightages
  const overlapIntelligence = useMemo(() => {
    const totalVal = portfolioMetrics.totalCurrent || 1;
    const stockMap = {}; // stockName -> { totalRupees, totalPct, directRupees, indirectRupees, sources: [] }
    const sectorMap = {}; // sectorName -> { rupees, pct, benchPct }

    Object.keys(SECTOR_BENCHMARK_WEIGHTS).forEach((sec) => {

      const isDirect = h.assetClass === 'Direct Equity';

      // Accumulate underlying stock weightages
      if (mapping.stockExposure) {
        Object.entries(mapping.stockExposure).forEach(([stockName, sharePct]) => {

            };

          stockMap[stockName].totalRupees += exposedRupees;
          if (isDirect) {
            stockMap[stockName].directRupees += exposedRupees;
          } else {
            stockMap[stockName].indirectRupees += exposedRupees;
          }
          stockMap[stockName].sourceCount += 1;
          stockMap[stockName].sources.push({
            holdingName: h.name,
            assetClass: h.assetClass,
            sharePct,
            rupees: exposedRupees
          });
        });
      }

      // Accumulate sector weightages
      if (isDirect && mapping.sector) {
        if (!sectorMap[mapping.sector]) {
          sectorMap[mapping.sector] = {
            sector: mapping.sector,
            rupees: 0,
            pct: 0,
            benchPct: SECTOR_BENCHMARK_WEIGHTS[mapping.sector] || 10
          };
        }
        sectorMap[mapping.sector].rupees += h.current;
      } else if (mapping.sectorMix) {
        Object.entries(mapping.sectorMix).forEach(([secName, secSharePct]) => {
          if (!sectorMap[secName]) {
            sectorMap[secName] = {
              sector: secName,
              rupees: 0,
              pct: 0,
              benchPct: SECTOR_BENCHMARK_WEIGHTS[secName] || 10
            };
          }
          sectorMap[secName].rupees += h.current * (secSharePct / 100);
        });
      }
    });

    const stocks = Object.values(stockMap)
      .map((s) => ({
        ...s,
        totalPct: (s.totalRupees / totalVal) * 100,
        isOverlapped: s.sourceCount >= 2
      }))
      .sort((a, b) => b.totalRupees - a.totalRupees);

    const totalSectorRupees = Object.values(sectorMap).reduce((acc, s) => acc + s.rupees, 0) || 1;
    const sectors = Object.values(sectorMap)
      .map((sec) => {
        const pct = (sec.rupees / totalSectorRupees) * 100;
        const driftPp = pct - sec.benchPct;
        return {
          ...sec,
          pct,
          driftPp,
          overlapIntensity: Math.min(100, Math.round((pct / Math.max(1, sec.benchPct)) * 65))
        };
      })
      .sort((a, b) => b.pct - a.pct);

    // Pairwise Overlap Matrix across Equity, MF & ETF holdings
    const equityLikeHoldings = portfolioMetrics.enrichedHoldings.filter((h) =>
      ['Direct Equity', 'Mutual Funds', 'ETFs'].includes(h.assetClass)
    );

    const getStockSet = (h) => {
      const m = LOOKTHROUGH_EXPOSURE_MAP[h.id];
      return new Set(Object.keys(m?.stockExposure || {}));
    };

    const pairwisePairs = [];
    for (let i = 0; i < equityLikeHoldings.length; i++) {
      for (let j = i + 1; j < equityLikeHoldings.length; j++) {
        const a = equityLikeHoldings[i];
        const b = equityLikeHoldings[j];
        const setA = getStockSet(a);
        const setB = getStockSet(b);
        const shared = [...setA].filter((x) => setB.has(x));
        if (shared.length > 0) {
          const unionCount = new Set([...setA, ...setB]).size || 1;
          const jaccardPct = Math.round((shared.length / unionCount) * 100);
          pairwisePairs.push({
            id: `${a.id}-${b.id}`,
            sourceA: a.name,
            classA: a.assetClass,
            sourceB: b.name,
            classB: b.assetClass,
            sharedStocks: shared,
            overlapPct: Math.min(95, Math.max(18, jaccardPct + shared.length * 14))
          });
        }
      }
    }

    pairwisePairs.sort((a, b) => b.overlapPct - a.overlapPct);

    const overlappedStocksCount = stocks.filter((s) => s.isOverlapped).length;
    const top3StockConcentrationPct = stocks
      .slice(0, 3)
      .reduce((acc, s) => acc + s.totalPct, 0);
    const topSector = sectors[0] || null;

    return {
      stocks,
      sectors,
      pairwisePairs: pairwisePairs.slice(0, 8),
      overlappedStocksCount,
      top3StockConcentrationPct,
      topSector
    };
  }, [portfolioMetrics.enrichedHoldings, portfolioMetrics.totalCurrent]);

  // Step 6: Parametric Shock Calculation (-5%, -7.5%, -10%)
  const parametricShockResult = useMemo(() => {
    let totalPostShockValue = 0;
    const classImpacts = ASSET_CLASSES.map((cls) => {
      const currentVal = portfolioMetrics.classBreakdown[cls]?.current || 0;
      let shockMultiplier = 0;
      if (cls === 'Direct Equity') shockMultiplier = 1.12;
      else if (cls === 'Mutual Funds') shockMultiplier = 1.02;
      else if (cls === 'ETFs') shockMultiplier = 1.05;
      else if (cls === 'SGB / Gold') shockMultiplier = -0.25;
      else if (cls === 'Bonds') shockMultiplier = -0.12;
      else shockMultiplier = 0;

      const assetShockPct = selectedShockPct * shockMultiplier;
      const rupeeDelta = (assetShockPct / 100) * currentVal;
      const postValue = currentVal + rupeeDelta;
      totalPostShockValue += postValue;

      return {
        assetClass: cls,
        currentVal,
        assetShockPct,
        rupeeDelta,
        postValue
      };
    });

    const netRupeeImpact = totalPostShockValue - portfolioMetrics.totalCurrent;
    const netPortfolioShockPct =
      portfolioMetrics.totalCurrent > 0 ? (netRupeeImpact / portfolioMetrics.totalCurrent) * 100 : 0;

    return {
      totalPostShockValue,
      netRupeeImpact,
      netPortfolioShockPct,
      classImpacts
    };
  }, [selectedShockPct, portfolioMetrics]);

  // Step 5: Historical Crisis Replay Calculation
  const historicalCrisisResult = useMemo(() => {
    const crisis = HISTORICAL_CRISES.find((c) => c.id === selectedCrisisId) || HISTORICAL_CRISES[0];
    let postCrisisTotal = 0;

    const breakdown = ASSET_CLASSES.map((cls) => {
      const currentVal = portfolioMetrics.classBreakdown[cls]?.current || 0;
      const empiricalPct = crisis.impacts[cls] || 0;
      const deltaRupees = (empiricalPct / 100) * currentVal;
      const postVal = currentVal + deltaRupees;
      postCrisisTotal += postVal;

      return {
        assetClass: cls,
        currentVal,
        empiricalPct,
        deltaRupees,
        postVal
      };
    });

    const netDrawdownRupees = postCrisisTotal - portfolioMetrics.totalCurrent;
    const netDrawdownPct =
      portfolioMetrics.totalCurrent > 0 ? (netDrawdownRupees / portfolioMetrics.totalCurrent) * 100 : 0;
    const alphaBufferVsNifty = netDrawdownPct - crisis.niftyDrawdown;

    return {
      crisis,
      postCrisisTotal,
      netDrawdownRupees,
      netDrawdownPct,
      alphaBufferVsNifty,
      breakdown
    };
  }, [selectedCrisisId, portfolioMetrics]);

  // Step 6: Overall Portfolio Health Score (/100)

    const alphaScore = Math.min(30, Math.max(8, 18 + portfolioMetrics.portfolioAlpha * 2.5));
    const resilienceScore = Math.min(30, Math.max(10, portfolioMetrics.sharpeRatio * 22 + 12));

    const totalHealthScore = Math.round(alignmentScore + alphaScore + resilienceScore);

    let alignmentStatus = 'Well Aligned';
    if (maxAbsVariance > 10) alignmentStatus = 'Rebalancing Recommended';
    else if (maxAbsVariance > 5) alignmentStatus = 'Minor Tactical Drift';

    let resilienceRating = 'Strong Hedge Cushion';
    if (portfolioMetrics.weightedBeta > 1.0) resilienceRating = 'High Equity Beta Sensitivity';
    else if (portfolioMetrics.weightedBeta < 0.65) resilienceRating = 'Defensive Capital Shield';

    return {
      healthScore: Math.min(98, totalHealthScore),
      alignmentStatus,
      resilienceRating,
      maxAbsVariance
    };

  // ==========================================================================

    const total = items.reduce((sum, item) => sum + Math.max(0, Number(item[valueKey]) || 0), 0);
    if (total <= 0) return [];
    const radius = 64;
    const circumference = 2 * Math.PI * radius;
    let accumulatedPct = 0;

      const val = Math.max(0, Number(item[valueKey]) || 0);
      const pct = (val / total) * 100;
      const dashLength = (pct / 100) * circumference;
      const dashOffset = -(accumulatedPct / 100) * circumference;
      accumulatedPct += pct;

      return {
        ...item,
        pct,
        dashArray: `${Math.max(0, dashLength - 1.2)} ${circumference}`,
        dashOffset
      };
    });
  };
